name: CI Python Level 4

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * *' 

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install flake8
        run: pip install flake8
      - name: Lint with flake8
        run: flake8 main.py test_main.py --max-line-length=120 --ignore=W291,W293,E501,E302,E305

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pytest pytest-cov

      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Create Artifact
        run: |
          mkdir artifact
          cp main.py artifact/
          tar -czvf my-script.tar.gz -C artifact .

      - name: Upload script artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-script-archive
          path: my-script.tar.gz
